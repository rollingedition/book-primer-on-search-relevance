[concepts.relations]
part-of = ["ab-test"]
contrasts-with = ["treatment"]

[[concepts]]
id = "treatment"
term = "treatment"
definition = "the changed system is the treatment"
section = "run-an-ab-test"

[concepts.relations]
part-of = ["ab-test"]

[[concepts]]
id = "aa-test"
term = "A/A test"
aliases = ["A/A tests"]
definition = "an A/A test, in which both groups get the same system"
