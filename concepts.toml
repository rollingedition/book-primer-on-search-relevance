definition = "Faithfulness is the share of an answer's claims that the context supports."
section = "check-citation-support"
example = "faithful-but-partial"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/retrieval-augmented-generation/faithfulness"]

[[concepts]]
id = "context-precision"
term = "context precision"
aliases = ["context precision@k"]
definition = "Ragas's context precision is the rank-aware one of its context measures, the mean of precision@k over the positions that hold a relevant chunk"
formula = "context precision@k = mean of precision@i over the positions i ≤ k that hold an exact product"
section = "measure-the-context"
example = "context-measures-by-hand"

[concepts.relations]
computed-from = ["precision-at-k"]
contrasts-with = ["context-recall"]

[[concepts]]
id = "context-recall"
term = "context recall"
aliases = ["context recall@k"]
definition = "context recall is the share of a reference answer's claims that the context supports"
formula = "context recall@k    = (exact products in the top k) / (exact products judged for the query)"
section = "measure-the-context"
example = "context-measures-by-hand"

[[concepts]]
id = "spearmans-rank-correlation"
term = "Spearman's rank correlation"
aliases = ["Spearman"]
definition = "Spearman's rank correlation is the correlation between two measures' ranks rather than their values, 1 when they order the cases the same way and near 0 when the orders are unrelated"
section = "measure-the-context"
example = "context-measures-against-answers"

[[concepts]]
id = "retrievable-unit"
term = "retrievable unit"
aliases = ["retrieval unit"]
definition = "A retrievable unit is the piece of text that retrieval scores and returns, and that a context holds: a whole document, a passage or a sentence."
section = "choose-the-retrievable-unit"
example = "retrievable-unit-on-train"

[concepts.relations]
part-of = ["retrieval-augmented-generation/context"]

[[concepts]]
id = "chunking"
term = "chunking"
definition = "chunking is the rule that cuts a document, such as a fixed number of tokens, sentences, paragraphs, or breaks chosen by meaning"
section = "choose-the-retrievable-unit"

[[concepts]]
id = "tool"
term = "tool"
aliases = ["tools"]
definition = "A tool is a function the program offers the model, described by a name, a description and its parameters."
section = "read-agent-searches"
example = "agent-picks-by-tool"

[concepts.relations]
prerequisite-of = ["tool-call"]
same-as = ["https://rollingedition.com/concepts/ai-agents/tool"]

[[concepts]]
id = "tool-call"
term = "tool call"
aliases = ["tool calls"]
definition = "A tool call is the model's request to run a tool with arguments."
section = "read-agent-searches"
example = "agent-searches-in-traces"

[concepts.relations]
part-of = ["agent-loop", "trace"]
same-as = ["https://rollingedition.com/concepts/ai-agents/tool-call"]

[[concepts]]
id = "agent-loop"
term = "agent loop"
definition = "In the agent loop, the program runs each tool call, sends back the result, and the model decides what to do next."
section = "read-agent-searches"
example = "agent-searches-in-traces"

[[concepts]]
id = "trace"
term = "trace"
aliases = ["traces"]
definition = "The trace is the record of every tool call and its result."
section = "read-agent-searches"
example = "agent-searches-in-traces"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/ai-agents/trace"]

[[concepts]]
id = "regression-set"
term = "regression set"
definition = "regression set: fixed queries, with judgments, that every change runs against before it ships"
section = "diff-runs-per-query"
example = "diff-semantic-against-bm25"

[[concepts]]
id = "baseline"
term = "baseline"
definition = "The ranker the store runs today is the baseline"
section = "diff-runs-per-query"
example = "diff-semantic-against-bm25"

[concepts.relations]
contrasts-with = ["candidate-ranker"]
close-to = ["https://rollingedition.com/concepts/artificial-intelligence/baseline"]

[[concepts]]
id = "candidate-ranker"
term = "candidate ranker"
definition = "the ranker with the change is the candidate ranker"
section = "diff-runs-per-query"
example = "diff-semantic-against-bm25"

[[concepts]]
id = "risk-sensitive-evaluation"
term = "risk-sensitive evaluation"
definition = "Risk-sensitive evaluation counts losses more heavily than wins."
section = "weigh-losses-with-urisk"

[[concepts]]
id = "urisk"
term = "URisk"
definition = "The risk-sensitive measure of the TREC 2013 Web track is URisk."
formula = "URisk = (1 / N) × [ sum of Δ(q) over improved queries  −  (α + 1) × sum of |Δ(q)| over hurt queries ]"
section = "weigh-losses-with-urisk"
example = "urisk-of-two-candidates"

[concepts.relations]
broader = ["risk-sensitive-evaluation"]
computed-from = ["baseline", "candidate-ranker"]

[[concepts]]
id = "sensitivity-check"
term = "sensitivity check"
definition = "a sensitivity check, which rescores both runs under two scenarios, one favouring each side"
section = "judge-new-results"
example = "unjudged-score-range"

[concepts.relations]
computed-from = ["unjudged"]

[[concepts]]
id = "ab-test"
term = "A/B test"
aliases = ["A/B tests", "controlled experiment"]
