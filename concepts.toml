# The terms this book defines, each quoted from the sentence that defines it (writing standards W-77 to W-80).

context = "search-and-recommendation"

[[concepts]]
id = "judgment"
term = "judgment"
definition = "A judgment is a person's label for one pair of a query and a product"
section = "store-data"
example = "judge-first-results"

[concepts.relations]
prerequisite-of = ["grade"]

[[concepts]]
id = "grade"
term = "grade"
definition = "a grade is the number that stands for a judgment's label."
section = "store-data"
example = "load-the-store"

[[concepts]]
id = "relevant"
term = "relevant"
definition = "In this book, a relevant product is one judged exact for the query, unless a sentence says otherwise."
section = "store-data"
example = "judge-first-results"

[concepts.relations]
measured-from = ["judgment"]

[[concepts]]
id = "retrieval"
term = "retrieval"
definition = "Retrieval finds the products that might match a query, out of the whole catalog."
section = "rank-with-bm25"
example = "first-bm25-search"

[concepts.relations]
prerequisite-of = ["ranking", "reranking"]

[[concepts]]
id = "bm25"
term = "BM25"
definition = "BM25 is a lexical scoring function with three parts."
section = "rank-with-bm25"
example = "bm25-by-hand"

[concepts.relations]
computed-from = ["term-frequency", "inverse-document-frequency"]
implemented-by = [{ to = "bm25s", versions = ">=0.3" }]
same-as = ["https://rollingedition.com/concepts/retrieval-augmented-generation/bm25"]

[[concepts]]
id = "ranking"
term = "ranking"
definition = "Ranking puts the retrieved products in order, best first."
section = "rank-with-bm25"
example = "first-bm25-search"

[concepts.relations]
contrasts-with = ["retrieval"]

[[concepts]]
id = "run"
term = "run"
definition = "The rankings for every query in a set form a run, written as `{query_id: [product_id, ...]}`, best first."
section = "score-every-test-query"
example = "bm25-test-scores"

[[concepts]]
id = "semantic-retrieval"
term = "semantic retrieval"
definition = "Semantic retrieval compares the meanings of the query and the product instead of their words."
section = "search-by-meaning"
example = "first-semantic-search"

[concepts.relations]
broader = ["retrieval"]
contrasts-with = ["lexical-retrieval"]
prerequisite-of = ["hybrid-retrieval"]

[[concepts]]
id = "embedding"
term = "embedding"
context = "semantic-search"
definition = "An embedding is a list of numbers, a vector, that a neural network computes for a piece of text."
section = "search-by-meaning"
example = "first-semantic-search"

[concepts.relations]
prerequisite-of = ["search-and-recommendation/semantic-retrieval"]

[[concepts]]
id = "reranking"
term = "reranking"
definition = "Reranking reorders a short list from retrieval with a slower model, one that can afford to look at the query and each product together because it only sees a few dozen products."
section = "rerank-with-cross-encoder"
example = "cross-encoder-rerank"

[[concepts]]
id = "cross-encoder"
term = "cross-encoder"
definition = "One kind of reranking model is a cross-encoder, which reads the query and the product text together, as one input, and outputs one relevance score for the pair, scoring each pair independently"
section = "rerank-with-cross-encoder"
example = "cross-encoder-rerank"

[concepts.relations]
broader = ["reranking"]
contrasts-with = ["large-language-model"]

[[concepts]]
id = "large-language-model"
term = "large language model"
aliases = ["LLM"]
definition = "An LLM is a model trained on large amounts of text to generate text in response to a prompt."
section = "rerank-with-cross-encoder"

[[concepts]]
id = "information-need"
term = "information need"
definition = "The judge grades the product against the information need behind the query's words, the thing the shopper wanted, not against the words."
section = "relevance-is-a-judgment"
example = "word-match-versus-judgment"

[concepts.relations]
prerequisite-of = ["judgment"]

[[concepts]]
id = "intent"
term = "intent"
definition = "A shopper's intent is what they want to do."
section = "intent-in-product-search"

[[concepts]]
id = "target-entity"
term = "target entity"
definition = "A query names a target entity, the kind of product"
section = "intent-in-product-search"
example = "predicted-class-check"

[concepts.relations]
contrasts-with = ["modifier"]

[[concepts]]
id = "modifier"
term = "modifier"
aliases = ["modifiers"]
definition = "the query's modifiers are the attributes the shopper asked for."
section = "intent-in-product-search"

[[concepts]]
id = "binary-label"
term = "binary label"
definition = "A binary label says relevant or not."
section = "graded-relevance"
example = "binary-labels-hide-partial"

[concepts.relations]
contrasts-with = ["graded-label"]

[[concepts]]
id = "graded-label"
term = "graded label"
aliases = ["graded judgments"]
definition = "A graded label, such as WANDS's exact, partial or irrelevant, says how relevant."
section = "graded-relevance"
example = "binary-labels-hide-partial"

[[concepts]]
id = "gain"
term = "gain"
context = "search-evaluation"
aliases = ["gains"]
definition = "A gain is what a result at a given position adds to the score before the position discount."
section = "graded-relevance"
example = "gain-choice-changes-ndcg"

[concepts.relations]
part-of = ["search-and-recommendation/dcg"]

[[concepts]]
id = "position-bias"
term = "position bias"
definition = "position bias: people click higher-ranked results more, partly because they trust the ranking."
section = "clicks-are-not-judgments"
example = "cascade-clicks"

[[concepts]]
id = "cascade-model"
term = "cascade model"
definition = "In the cascade model, users read results from top to bottom and leave at the first worthwhile document"
section = "clicks-are-not-judgments"
example = "cascade-clicks"

[[concepts]]
id = "presentation-bias"
term = "presentation bias"
definition = "Presentation bias goes beyond position: clicks depend on how a result is shown, not only on where."
section = "clicks-are-not-judgments"

[concepts.relations]
contrasts-with = ["position-bias"]

[[concepts]]
id = "pool"
term = "pool"
definition = "Nobody judges every product for every query, so test collections judge a pool instead, a set of candidates gathered for each query."
section = "pooled-judgments"

[concepts.relations]
prerequisite-of = ["unjudged"]

[[concepts]]
id = "unjudged"
term = "unjudged"
definition = "A product without a judgment for a query is unjudged for it"
section = "pooled-judgments"
example = "trundle-daybeds-unjudged"

[[concepts]]
id = "judged-at-k"
term = "Judged@k"
aliases = ["judged@10"]
definition = "Judged@k is the share of the top k that has a judgment of any grade"
formula = "judged@k = (number of the top k products that have a judgment for the query) / k"
section = "unjudged-results"
example = "unjudged-in-bm25-top-10"

[concepts.relations]
measured-from = ["judgment"]

[[concepts]]
id = "condensed-list"
term = "condensed list"
aliases = ["condensed"]
definition = "the condensed list, a ranking with its unjudged products dropped before scoring, so the judged ones move up"
section = "unjudged-results"
example = "condensed-ndcg"

[[concepts]]
id = "precision-at-k"
term = "Precision at k"
aliases = ["precision@k", "precision@10"]
definition = "Precision at k, written precision@k, is the share of the top k results that are relevant."
section = "count-relevant-in-top-k"
example = "precision-recall-by-hand"

[concepts.relations]
measured-from = ["judgment"]
contrasts-with = ["recall-at-k"]

[[concepts]]
id = "recall-at-k"
term = "Recall at k"
aliases = ["recall@k", "recall@10"]
definition = "Recall at k, recall@k, is the share of all relevant products that appear in the top k."
section = "count-relevant-in-top-k"
example = "precision-recall-by-hand"

[concepts.relations]
measured-from = ["judgment"]

[[concepts]]
id = "reciprocal-rank"
term = "Reciprocal rank"
aliases = ["RR"]
definition = "Reciprocal rank (RR) scores a query as 1 divided by the position of the first relevant result, or 0 if there is none"
section = "score-the-first-relevant-result"
example = "reciprocal-rank-by-hand"

[concepts.relations]
measured-from = ["judgment"]

[[concepts]]
id = "mean-reciprocal-rank"
term = "Mean reciprocal rank"
aliases = ["MRR"]
definition = "the mean of RR over queries is the mean reciprocal rank (MRR)"
section = "score-the-first-relevant-result"
example = "reciprocal-rank-by-hand"

[concepts.relations]
computed-from = ["reciprocal-rank"]

[[concepts]]
id = "dcg"
term = "Discounted cumulative gain"
aliases = ["DCG", "DCG@k"]
definition = "Each result contributes its grade as a gain, shrunk by a discount that grows with its position, and the sum is the discounted cumulative gain (DCG)."
formula = "DCG@k  = sum over positions i from 1 to k of  grade(i) / log2(i + 1)"
section = "build-ndcg-from-dcg"
example = "ndcg-from-scratch"

[concepts.relations]
computed-from = ["search-evaluation/gain"]

[[concepts]]
id = "ndcg"
term = "Normalized DCG"
aliases = ["nDCG", "nDCG@k", "nDCG@10"]
definition = "Normalized DCG (nDCG) divides a ranking's DCG by the DCG of the ideal ranking."
formula = "nDCG@k = DCG@k / DCG@k of the ideal ranking"
section = "build-ndcg-from-dcg"
example = "ndcg-from-scratch"

[concepts.relations]
computed-from = ["dcg"]
implemented-by = [{ to = "scikit-learn", versions = ">=1.9" }]

[[concepts]]
id = "per-query-differences"
term = "per-query differences"
definition = "per-query differences: one number per query, the new ranker's score minus the old one's"
section = "read-per-query-differences"
example = "per-query-hybrid-versus-bm25"

[concepts.relations]
close-to = ["https://rollingedition.com/concepts/llm-evaluation/paired-difference"]

[[concepts]]
id = "significance-test"
term = "significance test"
definition = "A significance test asks how surprising a gap between two rankers would be under the null hypothesis"
section = "permutation-test-on-queries"

[[concepts]]
id = "null-hypothesis"
term = "null hypothesis"
definition = "the null hypothesis, the assumption that the rankers are equally good"
section = "permutation-test-on-queries"

[concepts.relations]
prerequisite-of = ["significance-test", "p-value"]

[[concepts]]
id = "p-value"
term = "p-value"
definition = "p-value: the probability, under the null hypothesis, of a gap at least as large as the one you measured"
section = "permutation-test-on-queries"
example = "permutation-test-by-hand"

[concepts.relations]
part-of = ["significance-test"]

[[concepts]]
id = "paired-test"
term = "paired test"
aliases = ["paired"]
definition = "The tests in this book are paired: both rankers are scored on the same queries, so each test works on the per-query differences, and a hard query's low scores cancel out."
section = "permutation-test-on-queries"

[concepts.relations]
broader = ["significance-test"]
computed-from = ["per-query-differences"]
close-to = ["https://rollingedition.com/concepts/artificial-intelligence/paired-comparison"]

[[concepts]]
id = "permutation-test"
term = "permutation test"
definition = "A permutation test builds the gaps you'd see under the null hypothesis directly."
section = "permutation-test-on-queries"
example = "permutation-test-by-hand"

[concepts.relations]
broader = ["paired-test"]
implemented-by = [{ to = "scipy", versions = ">=1.18" }]

[[concepts]]
id = "standard-error"
term = "standard error"
definition = "standard error: the standard deviation of the differences divided by the square root of the number of queries, which estimates how far the mean would move from one sample of queries to another"
section = "paired-t-test-on-queries"
example = "paired-t-test-by-hand"

[concepts.relations]
computed-from = ["per-query-differences"]
close-to = ["https://rollingedition.com/concepts/llm-evaluation/standard-error-of-the-proportion"]

[[concepts]]
id = "t-distribution"
term = "t distribution"
definition = "t distribution: bell-shaped, with heavier tails than the normal, and a shape set by its degrees of freedom, here one fewer than the number of queries"
section = "paired-t-test-on-queries"

[[concepts]]
id = "confidence-interval"
term = "confidence interval"
definition = "A confidence interval is a range of plausible values for the true mean difference"
section = "report-the-size-of-a-gap"

[concepts.relations]
close-to = ["https://rollingedition.com/concepts/artificial-intelligence/interval"]

[[concepts]]
id = "bootstrap"
term = "bootstrap"
definition = "The bootstrap builds a confidence interval by resampling."
section = "report-the-size-of-a-gap"
example = "bootstrap-interval-by-hand"

[concepts.relations]
prerequisite-of = ["percentile-interval"]
implemented-by = [{ to = "scipy", versions = ">=1.18" }]

[[concepts]]
id = "percentile-interval"
term = "percentile interval"
definition = "The percentile interval is the middle 95% of the resampled means."
section = "report-the-size-of-a-gap"
example = "bootstrap-interval-by-hand"

[concepts.relations]
broader = ["confidence-interval"]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/percentile-bootstrap"]

[[concepts]]
id = "effect-size"
term = "effect size"
definition = "The effect size of a paired comparison is the mean difference divided by the standard deviation of the differences"
section = "report-the-size-of-a-gap"
example = "bootstrap-interval-by-hand"

[concepts.relations]
computed-from = ["per-query-differences"]
contrasts-with = ["p-value"]

[[concepts]]
id = "bonferroni-correction"
term = "Bonferroni correction"
aliases = ["Bonferroni"]
definition = "The Bonferroni correction is a simple, conservative fix: when you test m hypotheses, test each at 0.05 divided by m"
section = "when-a-difference-is-established"
example = "compare-chapter-one-rankers"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/bonferroni-correction"]

[[concepts]]
id = "evaluation-harness"
term = "evaluation harness"
definition = "an evaluation harness, which holds everything fixed except the ranker: the same queries, judgments, metrics and tests, so that two runs differ only in their rankings"
section = "compare-runs-in-a-harness"
example = "compare-chapter-one-rankers"

[[concepts]]
id = "judge"
term = "judge"
definition = "This chapter calls whoever gives a judgment, person or LLM, a judge"
section = "write-judging-guidelines"

[concepts.relations]
close-to = ["https://rollingedition.com/concepts/llm-evaluation/judge"]

[[concepts]]
id = "judging-guidelines"
term = "Judging guidelines"
definition = "Judging guidelines say what each grade means, how to choose between grades, and what to do with the cases that fall between them."
section = "write-judging-guidelines"
example = "print-judging-guidelines"

[[concepts]]
id = "observed-agreement"
term = "observed agreement"
definition = "The share of pairs on which two judges give the same grade, the observed agreement"
section = "agreement-beyond-chance"
example = "kappa-by-hand"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/llm-evaluation/agreement"]

[[concepts]]
id = "cohens-kappa"
term = "Cohen's kappa"
aliases = ["kappa"]
definition = "Cohen's kappa corrects the observed agreement for chance by comparing it with the agreement expected if each judge kept its own label shares but chose independently of the other."
formula = "kappa    = (observed - expected) / (1 - expected)"
section = "agreement-beyond-chance"
example = "kappa-by-hand"

[concepts.relations]
computed-from = ["observed-agreement"]
implemented-by = [{ to = "scikit-learn", versions = ">=1.9" }]
same-as = ["https://rollingedition.com/concepts/llm-evaluation/cohens-kappa"]
close-to = ["https://rollingedition.com/concepts/artificial-intelligence/kappa"]

[[concepts]]
id = "weighted-kappa"
term = "Weighted kappa"
definition = "Weighted kappa gives each disagreement a weight by its distance and compares the weighted disagreement with the weighted disagreement expected by chance"
formula = "weighted kappa = 1 - (sum of weight × observed count) / (sum of weight × count expected by chance)"
section = "weighted-kappa-for-grades"
example = "weighted-kappa-by-hand"

[concepts.relations]
contrasts-with = ["cohens-kappa"]
implemented-by = [{ to = "scikit-learn", versions = ">=1.9" }]

[[concepts]]
id = "linear-weights"
term = "linear weights"
definition = "With linear weights, a disagreement one grade apart weighs 0.5 and one two grades apart weighs 1"
section = "weighted-kappa-for-grades"
example = "weighted-kappa-by-hand"

[concepts.relations]
part-of = ["weighted-kappa"]

[[concepts]]
id = "confusion-matrix"
term = "confusion matrix"
definition = "A confusion matrix shows how two judges differ: a table of counts with one row for each of the store's grades and one column for each of the LLM's, both in the order exact, partial, irrelevant."
section = "read-llm-error-direction"
example = "llm-confusion-matrix"

[concepts.relations]
contrasts-with = ["cohens-kappa"]

[[concepts]]
id = "concordant-pair"
term = "concordant pair"
aliases = ["concordant"]
definition = "A pair of systems is concordant when two orderings put it the same way round"
section = "system-order-human-versus-llm"
example = "kendall-tau-four-rankers"

[concepts.relations]
contrasts-with = ["discordant-pair"]

[[concepts]]
id = "discordant-pair"
term = "discordant pair"
aliases = ["discordant"]
definition = "A pair of systems is concordant when two orderings put it the same way round, and discordant when two orderings put it opposite ways round."
section = "system-order-human-versus-llm"
example = "kendall-tau-four-rankers"

[[concepts]]
id = "kendalls-tau"
term = "Kendall's tau"
aliases = ["tau"]
definition = "Tau is concordant pairs minus discordant pairs, divided by all pairs, from 1 for the same order to −1 for the reverse."
section = "system-order-human-versus-llm"
example = "kendall-tau-four-rankers"

[concepts.relations]
computed-from = ["concordant-pair", "discordant-pair"]
implemented-by = [{ to = "scipy", versions = ">=1.18" }]

[[concepts]]
id = "prediction-powered-inference"
term = "Prediction-powered inference"
definition = "Prediction-powered inference rigorously corrects a model's predictions with a human sample, with confidence intervals that hold \"without making any assumptions on the machine-learning algorithm that supplies the predictions\""
formula = "corrected = mean over all queries of the LLM score + mean over the human sample of (human score − LLM score)"
section = "calibrate-on-a-human-sample"
example = "correct-llm-scores-with-humans"

[[concepts]]
id = "lexical-retrieval"
term = "Lexical retrieval"
definition = "Lexical retrieval finds and ranks products by the words they share with the query."
section = "lexical-retrieval"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/lexical-retrieval"]

[[concepts]]
id = "token"
term = "token"
definition = "Splitting the text into pieces gives tokens."
section = "split-text-into-terms"
example = "tokenize-product-text"

[concepts.relations]
prerequisite-of = ["term"]

[[concepts]]
id = "stop-word"
term = "stop word"
definition = "stop words, very common words such as `the` and `with`"
section = "split-text-into-terms"
example = "tokenize-product-text"

[[concepts]]
id = "term"
term = "term"
definition = "Removing stop words, very common words such as `the` and `with`, leaves the terms that search compares"
section = "split-text-into-terms"
example = "tokenize-product-text"

[concepts.relations]
part-of = ["vocabulary"]

[[concepts]]
id = "vocabulary"
term = "vocabulary"
definition = "all the terms in the catalog form its vocabulary"
section = "split-text-into-terms"
example = "inverted-index-by-hand"

[[concepts]]
id = "probe-query"
term = "probe query"
definition = "a probe query: one written for this chapter to test a behaviour, not one of the store's queries"
section = "split-text-into-terms"
example = "tokenize-product-text"

[[concepts]]
id = "inverted-index"
term = "inverted index"
definition = "An inverted index turns the texts around: for each term, it keeps the list of products that contain the term"
section = "build-an-inverted-index"
example = "inverted-index-by-hand"

[[concepts]]
id = "postings"
term = "postings"
definition = "the list of products that contain the term, called the term's postings"
section = "build-an-inverted-index"
example = "inverted-index-by-hand"

[concepts.relations]
part-of = ["inverted-index"]

[[concepts]]
id = "term-frequency"
term = "term frequency"
aliases = ["tf"]
definition = "With each product, the postings store the term frequency, the number of times the term occurs in that product's text."
section = "build-an-inverted-index"
example = "inverted-index-by-hand"

[concepts.relations]
part-of = ["postings"]

[[concepts]]
id = "document-frequency"
term = "document frequency"
definition = "The number of products in a term's postings is its document frequency"
section = "build-an-inverted-index"
example = "inverted-index-by-hand"

[concepts.relations]
computed-from = ["postings"]

[[concepts]]
id = "inverse-document-frequency"
term = "inverse document frequency"
aliases = ["IDF"]
definition = "the inverse document frequency, IDF: the logarithm of the number of products divided by the term's document frequency, high for a rare term and low for a common one"
formula = "idf(t)       = ln(N / df(t))"
section = "weight-terms-with-tf-idf"
example = "tf-idf-by-hand"

[concepts.relations]
computed-from = ["document-frequency"]

[[concepts]]
id = "tf-idf"
term = "TF-IDF"
definition = "TF-IDF multiplies tf and IDF for each query term and adds them up"
formula = "tf-idf(q, d) = sum over query terms t of  tf(t, d) × idf(t)"
section = "weight-terms-with-tf-idf"
example = "tf-idf-by-hand"

[concepts.relations]
computed-from = ["term-frequency", "inverse-document-frequency"]
contrasts-with = ["bm25"]

[[concepts]]
id = "saturation"
term = "saturation"
definition = "With saturation, each repeat of a term adds less than the one before, and no number of repeats can push the term's contribution past a ceiling"
section = "bm25-from-scratch"
example = "bm25-by-hand"

[concepts.relations]
part-of = ["bm25"]

[[concepts]]
id = "length-normalization"
term = "length normalization"
definition = "With length normalization, a long text, which has more chances to contain any term, gets its term frequencies discounted."
section = "bm25-from-scratch"
example = "bm25-by-hand"

[concepts.relations]
part-of = ["bm25"]

[[concepts]]
id = "stemming"
term = "Stemming"
definition = "Stemming cuts common endings off words, so that the forms of a word share one term"
section = "stem-word-forms"
example = "stemmer-merges-word-forms"

[concepts.relations]
prerequisite-of = ["stem"]
implemented-by = [{ to = "pystemmer", versions = ">=3.1" }]

[[concepts]]
id = "stem"
term = "stem"
definition = "the forms of a word share one term, its stem"
section = "stem-word-forms"
example = "stemmer-merges-word-forms"

[[concepts]]
id = "field"
term = "field"
definition = "A product's text has parts, called fields"
section = "weight-the-product-name"
example = "fields-scored-apart"

[concepts.relations]
prerequisite-of = ["bm25f"]

[[concepts]]
id = "bm25f"
term = "BM25F"
definition = "Combining a term's weighted frequencies across fields before saturating the total is BM25F."
section = "weight-the-product-name"
example = "repeat-the-name-field"

[concepts.relations]
computed-from = ["term-frequency"]

[[concepts]]
id = "attribute"
term = "attribute"
definition = "a catalog often keeps facts about a product as structured attributes, such as `color: clear` or `material: glass`"
section = "index-attributes-as-a-field"
example = "add-attributes-field"

[[concepts]]
id = "phrase-match"
term = "phrase match"
definition = "A phrase match needs the terms next to each other and in order"
section = "match-phrases-with-positions"
example = "phrase-positions-by-hand"

[[concepts]]
id = "positional-index"
term = "positional index"
definition = "A positional index stores, for each term and product, the positions where the term occurs, so that a phrase becomes a check on positions"
section = "match-phrases-with-positions"
example = "phrase-positions-by-hand"

[[concepts]]
id = "encoder"
term = "encoder"
definition = "The model that computes an embedding is an encoder, trained so that texts with similar meanings get vectors that point in similar directions, whether or not they share words."
section = "turn-text-into-embeddings"

[concepts.relations]
prerequisite-of = ["bi-encoder"]

[[concepts]]
id = "dimension"
term = "dimension"
definition = "Every text gets the same count of numbers, the embedding's dimension, whether it's a three-word query or a product's whole description."
section = "turn-text-into-embeddings"
