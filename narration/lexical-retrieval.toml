# Spoken descriptions for chapter 5, Lexical retrieval: what narration reads in place of each example, block and table.

[examples.tokenize-product-text]
say = "The code writes bm25s's tokenizer by hand: lowercase, keep runs of two or more word characters, and drop its 33 stop words. It splits {{out:tokenize-product-text:products tokenized differently}} products differently from bm25s. Then it prints what the train query 7qt slow cooker and the name of product 1, a 7 qt slow cooker, become, and counts the products with the term 7qt, {{out:tokenize-product-text:products with the term 7qt}}, against those whose text says 7 qt. Last, it counts the queries that a pattern keeping digits apart would change, and shows the probe query rug not wool losing its not."

[examples.inverted-index-by-hand]
say = "The code builds an inverted index from every product's text: for each term, the products that contain it and how often. It prints the vocabulary's size, the average product length and the first postings for cooker, then how many products hold each term of 7qt slow cooker. No product contains 7qt, so the products with every query term number {{out:inverted-index-by-hand:products with every query term}}, while {{out:inverted-index-by-hand:products with any query term}} hold at least one."

[examples.tf-idf-by-hand]
say = "The code computes TF-IDF over the inverted index, prints the IDF of furniture and of each term of laundry basket with wheels, and shows TF-IDF's top 3 for that query with each product's term counts. A partial basket that repeats basket comes first, above the one exact product, the only one of the three that says wheels. Then it scores TF-IDF and BM25 on the train queries: {{out:tf-idf-by-hand:tf-idf train ndcg@10}} against {{out:tf-idf-by-hand:bm25 train ndcg@10}}."

[examples.bm25-by-hand]
say = "The code writes BM25 as bm25s computes it, over the inverted index with k1 set to 1.5 and b to 0.75, and compares every product's score for every query with bm25s's: the largest difference is {{out:bm25-by-hand:largest score difference from bm25s}}. It also prints Robertson's and Lucene's IDF for the common word your, and a term's weight at 1, 2, 4 and 9 occurrences. Asked whether both give the same top 100 for every query, it answers {{out:bm25-by-hand:same top 100 for every query}}."

[examples.stemmer-merges-word-forms]
say = "The code stems eight words two ways, with a stemmer written by hand that cuts a few common endings, and with Snowball English from PyStemmer. The two agree on every word but moldings. Then it counts the products whose text contains floats and molding, against those that contain their stems, and compares the vocabulary with and without stemming: it shrinks by {{out:stemmer-merges-word-forms:vocabulary reduction}}."

[examples.bm25s-with-a-stemmer]
say = "The code indexes the products with bm25s and the Snowball stemmer, tokenizes every query the same way, and compares bm25s's scores with those of the hand-built stemmed index. The query pool floats becomes pool and float, and the largest score difference is {{out:bm25s-with-a-stemmer:largest score difference from bm25s with a stemmer}}."

[examples.measure-stemming]
say = "The code scores BM25 with and without stemming on the train and test queries, prints both scores for pool floats and french molding, then runs the planned test comparison at a threshold of 0.01. Stemming gains {{out:measure-stemming:mean difference}} on the test queries. Asked whether the gain is established, the code answers {{out:measure-stemming:established at 0.01}}, and whether the t-test agrees, {{out:measure-stemming:t-test agrees}}. One test query gains {{out:measure-stemming:its gain}} on its own."

[examples.sweep-k1-and-b]
say = "The code sweeps a grid of {{out:sweep-k1-and-b:settings in the grid}} settings of k1 and b over the stemmed index on the train queries, prints the grid, and picks the best: k1 of {{out:sweep-k1-and-b:best k1 on train}} and b of {{out:sweep-k1-and-b:best b on train}}. Asked whether that setting lies on the grid's edge, it answers {{out:sweep-k1-and-b:best setting on the grid's edge}}. Then it compares the setting with the defaults on the test queries, a mean difference of {{out:sweep-k1-and-b:mean difference}}."

[examples.fields-scored-apart]
say = "On the train queries, the code indexes the product name and the other three fields apart, scores each with BM25, adds the two scores, and compares the result with one combined field: {{out:fields-scored-apart:fields scored apart, train ndcg@10}} against {{out:fields-scored-apart:one field, train ndcg@10}}."

[examples.repeat-the-name-field]
say = "The code repeats the product name 1, 2, 3 or 5 times in the indexed text, scores each version on the train queries, and picks the best, a name weight of {{out:repeat-the-name-field:best name weight on train}}. Then it compares that weight with one field on the test queries, a mean difference of {{out:repeat-the-name-field:mean difference}}. Asked whether the gain is established, it answers {{out:repeat-the-name-field:established at 0.01}}."

[examples.add-attributes-field]
say = "The code adds each product's attributes, names and values, to its indexed text, and counts the exact products for clear shower curtain that say clear: {{out:add-attributes-field:exact, with clear in their text}} in their text, and {{out:add-attributes-field:exact, with clear in text or attributes}} once attributes count. It also counts the products whose attributes name a size. Then it scores both indexes on the train and test queries, prints two test queries, clear shower curtain and medium size chandelier, and runs the planned test comparison."

[examples.phrase-positions-by-hand]
say = "The code builds a positional index over the product names, checks that BM25 gives barn door and door barn the same scores, and counts the names with both words, {{out:phrase-positions-by-hand:names with barn and door}}, and those with the phrase, {{out:phrase-positions-by-hand:names with the phrase barn door}}. Then it lists the names that have both words but not the phrase: two door mats, a duvet cover, a hardware kit for barn doors, and a glass shower door."

[examples.phrase-bonus-train-and-test]
say = "The code adds a bonus to a product's BM25 score for each pair of adjacent query terms that its name holds in order. It tries bonuses of 0, 0.5, 1 and 2 on the train queries and picks {{out:phrase-bonus-train-and-test:best bonus on train}}, then compares that bonus with none on the test queries, a mean difference of {{out:phrase-bonus-train-and-test:mean difference}}."

[[blocks]]
section = "weight-terms-with-tf-idf"
starts = "idf(t)       = ln(N / df(t))"
say = "A term's IDF is the natural log of the number of products, N, divided by the number of products that contain the term. A product's TF-IDF score for a query is the sum, over the query's terms, of each term's frequency in the product times its IDF."

[[blocks]]
section = "bm25-from-scratch"
starts = "idf(t)     = ln(1 + (N"
say = "Here a term's IDF is the natural log of 1 plus a ratio: the number of products that don't contain the term, plus one half, over the number that do, plus one half. A product's BM25 score is the sum, over the query's terms, of the IDF times the term's frequency divided by that frequency plus k1 times a length factor. The length factor is 1 minus b, plus b times the product's length over the average length."

[[tables]]
section = "lexical-retrieval-decisions"
starts = "| Measure |"
say = "A table of the chapter's five planned comparisons on the test queries, one per column: stemming, the best k1 and b, the best name weight, the attributes field and the best phrase bonus, each against the same search without it. Its rows give the mean difference, the 99% interval, both p-values, the wins, losses and ties, whether the difference is established, and whether the t-test and the interval agree. Only stemming is established."
