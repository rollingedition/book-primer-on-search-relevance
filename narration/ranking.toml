# Spoken descriptions for chapter 9, Ranking: what narration reads in place of each example, block and table.

[examples.ranking-features-by-grade]
say = "The code builds the feature table for the train queries' candidates, {{out:ranking-features-by-grade:features}} features each, and prints the six candidates for laundry basket with wheels that the cross-encoder scores highest, {{out:ranking-features-by-grade:top 6 by cross-encoder, exact}} of them exact. Then it prints each feature's mean by grade. The cross-encoder score, BM25, similarity and name match all fall from exact to irrelevant, and unjudged candidates sit nearer the irrelevant ones than the partial ones on {{out:ranking-features-by-grade:relevance features where unjudged sits nearer irrelevant than partial}} of those features. It also prints the rating counts' medians beside their means."

[examples.lambdas-for-one-query]
say = "For the train query outdoor waterproof chest, the code takes semantic retrieval's top 10 as the model's ranking so far, and computes the lambda of every pair with different grades by hand, checking each change in nDCG by swapping the pair. It adds up the force on each position: the strongest push up goes to position {{out:lambdas-for-one-query:strongest push up, position}}, and the strongest push down to position {{out:lambdas-for-one-query:strongest push down, position}}. RankNet's factor stays between {{out:lambdas-for-one-query:ranknet's pull, lowest}} and {{out:lambdas-for-one-query:ranknet's pull, highest}}."

[examples.lambdas-match-lightgbm]
say = "The code writes the chapter's lambdas as a custom LightGBM objective, grows five small trees on the candidates of outdoor waterproof chest, and grows them again with LightGBM's lambdarank, with and without its normalization and truncation. Without them, LightGBM's scores match the custom objective's within {{out:lambdas-match-lightgbm:lightgbm, no normalization or truncation, largest difference from the lambdas by hand after 5 trees}}; at its defaults, they differ by up to {{out:lambdas-match-lightgbm:lightgbm at its defaults, largest difference from the lambdas by hand after 5 trees}}."

[examples.lambdamart-tree-size-on-train]
say = "The code cross-validates LambdaMART over five folds of the train queries, at 3, 7, 15 and 31 leaves and two learning rates, with unjudged candidates as grade 0, and prints each setting's nDCG@10 and the trees early stopping keeps in each fold. The best of the {{out:lambdamart-tree-size-on-train:settings tried}} settings is {{out:lambdamart-tree-size-on-train:best setting}}."

[examples.lambdamart-choices-on-train]
say = "At the chosen tree size, the code cross-validates three setups on the train queries: LambdaMART with unjudged candidates as grade 0, LambdaMART on judged candidates only, and a pointwise regression on the grades. The first scores highest, {{out:lambdamart-choices-on-train:lambdarank, unjudged as 0, cross-validated ndcg@10}}, and the other two fall short of it by margins the permutation test can tell from chance. Its gain over semantic retrieval, {{out:lambdamart-choices-on-train:first setup minus semantic}}, has a permutation p-value of {{out:lambdamart-choices-on-train:first setup minus semantic, permutation p}}."

[examples.lambdamart-on-test]
say = "The code fits LambdaMART on {{out:lambdamart-on-test:queries fitted}} train queries, with early stopping on {{out:lambdamart-on-test:queries held out for stopping}} others, and prints the trees it keeps and each feature's share of the gain, led by the cross-encoder at {{out:lambdamart-on-test:share of gain, cross_encoder}}. Then it ranks each test query's candidates and makes the planned comparison with semantic retrieval: {{out:lambdamart-on-test:lambdamart, test ndcg@10}} against {{out:lambdamart-on-test:semantic, test ndcg@10}}."

[examples.cross-encoder-on-semantic]
say = "The code reorders semantic retrieval's top 20 for every test query by the recorded cross-encoder scores, checks that those are the products the LLM rerankers saw, and counts the queries whose first product changes: {{out:cross-encoder-on-semantic:queries whose first product changes}}. Then it makes the planned comparison: the rerank scores {{out:cross-encoder-on-semantic:cross-encoder, test ndcg@10}} against semantic retrieval's {{out:cross-encoder-on-semantic:semantic, test ndcg@10}}."

[examples.llm-pointwise-rerank]
say = "The code reads the LLM's answers for semantic retrieval's top 20 on each test query, one call per product, and counts how coarse the scores are: a median of {{out:llm-pointwise-rerank:distinct scores per query, median}} distinct scores per query, with a share of {{out:llm-pointwise-rerank:share of products scored 100}} of all products at 100. It compares the LLM's labels with people's judgments of the same products, reranks by the score with semantic retrieval's order breaking ties, and makes the planned comparison."

[examples.llm-listwise-rerank]
say = "The code reads the LLM's listwise answers, one per test query and order shown, counts those that needed repair, {{out:llm-listwise-rerank:answers that needed repair}}, and prints the prompt's last instruction. Then it reorders semantic retrieval's top 20 by the answer given for the semantic order, counts the queries whose first product changes, and makes the planned comparison: {{out:llm-listwise-rerank:llm listwise, test ndcg@10}} against {{out:llm-listwise-rerank:semantic, test ndcg@10}}."

[examples.listwise-position-bias]
say = "For each test query, the code compares the LLM's two listwise answers, one for the top 20 shown in semantic order and one for them reversed: Kendall's tau between the two answers, the products their top 10s share, and whether they put the same product first, which they do for {{out:listwise-position-bias:queries with the same first product}} queries. It also measures how close each answer stays to the order it was shown, and scores the reversed answer, outside the planned comparisons."

[examples.reranker-prompt-sizes]
say = "For semantic retrieval's top 20 on each test query, the code counts the model calls and the characters each reranker reads: the cross-encoder, the pointwise LLM and the listwise LLM. It adds the calls two designs the store didn't record would need: every pair in both orders, {{out:reranker-prompt-sizes:llm pairwise, every pair in both orders, calls per query}} calls per query, and a sliding window over the top 100, {{out:reranker-prompt-sizes:llm listwise over the top 100, window 20, step 10, calls per query}}."

[examples.rerank-depth-on-train]
say = "On the train queries, the code reranks semantic retrieval's top 5, 10, 20, 30, 50 and 75 by the cross-encoder, and prints each depth's nDCG@10 and its change from the depth before. The score peaks at a depth of 30, at {{out:rerank-depth-on-train:depth 30, train ndcg@10}}, and falls deeper. It also counts the pairs per query that scoring every candidate would take."

[examples.distillation-on-train]
say = "By cross-validation on the train queries, the code trains a student, a LightGBM regression on every feature but the cross-encoder's score, to predict that score, and a LambdaMART model on the same features with human grades. The student scores {{out:distillation-on-train:student, teacher's labels, train ndcg@10}}, above both the teacher's own order, {{out:distillation-on-train:teacher, train ndcg@10}}, and the human-graded ranker, {{out:distillation-on-train:lambdarank, human grades, same features, train ndcg@10}}."

[examples.distilled-ranker-on-test]
say = "The code fits the student on the teacher's scores for all {{out:distilled-ranker-on-test:train candidates the teacher labels}} train candidates, with early stopping, and prints the three features with the largest share of its gain, led by similarity at {{out:distilled-ranker-on-test:student's share of gain, similarity}}. On the test candidates, it measures how closely the student's order follows semantic similarity, a mean tau of {{out:distilled-ranker-on-test:tau between student and similarity, mean over test queries}}, and the cross-encoder, {{out:distilled-ranker-on-test:tau between student and cross_encoder, mean over test queries}}, then makes the planned comparison with semantic retrieval."

[[blocks]]
section = "learn-from-pairs"
starts = "λ_ij    = σ / (1 + exp"
say = "For a pair where product i should rank above product j, lambda is sigma over 1 plus e to the power of sigma times the gap between their scores, multiplied by the size of the change in nDCG if the two swapped places, with sigma set to 1. That change is the gap between their grades, times the gap between their discounts, 1 over log base 2 of 1 plus each one's position, divided by the ideal DCG."

[[tables]]
section = "rerank-depth-from-budget"
starts = "| Reranker, top 20 |"
say = "A table of what each reranker reads at depth 20. The cross-encoder makes {{out:reranker-prompt-sizes:cross-encoder, model calls per query}} model calls per query, the pointwise LLM {{out:reranker-prompt-sizes:llm pointwise, model calls per query}} and the listwise LLM {{out:reranker-prompt-sizes:llm listwise, model calls per query}}. The pointwise LLM reads the most text, about {{out:reranker-prompt-sizes:llm pointwise, characters read per query, mean}} characters per query, and the listwise LLM the least, about {{out:reranker-prompt-sizes:llm listwise, characters read per query, mean}}."

[[tables]]
section = "ranking-decisions"
starts = "| Measure |"
say = "A table of the chapter's five planned comparisons on the test queries, one per column: LambdaMART, the cross-encoder, the pointwise and listwise LLM rerankers, and the distilled ranker, each against semantic retrieval. Its rows give each one's nDCG@10, mean difference, wins, losses and ties, both p-values, whether the difference is established, the 99% interval, and whether the t-test and the interval agree. None of the five is established."
