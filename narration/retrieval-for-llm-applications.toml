# Spoken descriptions for chapter 10, Retrieval for LLM applications: what narration reads in place of each example,
# block and table.

[examples.catalog-against-the-context]
say = "The code reads the answer recording's manifest and prints the model, its licence, the prompt's instructions and the context window the recording set. Then it counts the words of every product as the LLM would read it. The whole catalog holds {{out:catalog-against-the-context:words in the catalog as the LLM reads it}} words, about {{out:catalog-against-the-context:the catalog against one prompt}} the size of a median prompt with five products."

[examples.rag-answers-by-context]
say = "The code scores the recorded answers on the human grades: one answer per test query from each of three contexts, semantic retrieval's top 5, BM25's top 5, and five random products. For each context it prints how many contexts hold an exact product, the products cited and the exact ones among them, the mean exact share, and the answers that recommend nothing. It checks that no answer cites more exact products than its context holds, then makes the first planned comparison, semantic retrieval against BM25 on the exact share. Given random products, the LLM recommends nothing in {{out:rag-answers-by-context:random, answers that recommend nothing}} answers."

[examples.citations-inside-the-context]
say = "For all {{out:citations-inside-the-context:answers}} recorded answers, the code checks each cited ID against the answer's context, looks for an ID cited twice, and compares the field of cited IDs with the context IDs the answer's text writes out. It finds {{out:citations-inside-the-context:answers that cite an ID outside their context}} answers that cite an ID outside their context, and {{out:citations-inside-the-context:answers that cite more than three products}} that cite more than the three products the prompt allows."

[examples.faithful-but-partial]
say = "The code reads one answer by hand, for medium size chandelier from the semantic context. It recommends one chandelier as a medium-sized fixture, the product's description does say medium-sized, and the judges labelled it {{out:faithful-but-partial:the judges' label}}, while its context held {{out:faithful-but-partial:exact products in this answer's context}} exact products. Then it counts the human grades of every product cited from the semantic and BM25 contexts: {{out:faithful-but-partial:cited products, exact}} exact, {{out:faithful-but-partial:cited products, partial}} partial and {{out:faithful-but-partial:cited products, irrelevant}} irrelevant."

[examples.context-measures-by-hand]
say = "The code builds context recall and context precision by hand for the {{out:context-measures-by-hand:contexts}} contexts the two retrievers built, and checks them against the book's functions. It works through the semantic context for door jewelry organizer, whose exact products come last: its precision@5 is {{out:context-measures-by-hand:precision@5}}, and its context precision {{out:context-measures-by-hand:context precision@5}}. It also prints the range of exact products judged per test query, and the highest recall@5 the query with the most could reach."

[examples.context-measures-against-answers]
say = "For the same {{out:context-measures-against-answers:contexts}} contexts, the code computes the Spearman correlation of recall@5, precision@5 and context precision with each answer's exact share, by hand as the correlation of their ranks, and checks it against SciPy. Context precision tracks the answers most closely, at {{out:context-measures-against-answers:spearman with the exact share, context precision@5}}, and recall@5 least, at {{out:context-measures-against-answers:spearman with the exact share, recall@5}}."

[examples.retrievable-unit-on-train]
say = "The code counts the products with no description and those the sample cut short, then indexes five units with BM25: the whole product, the name, the description, each description sentence, and each sentence with the name, class and category in front. For each unit it ranks products by their best unit on the train queries, prints precision@5, recall@5 and judged@5, and counts the queries whose top 5 changes when ties break the other way. The highest precision@5 goes to the {{out:retrievable-unit-on-train:highest train precision@5}}, ahead of the sentences with the other fields by {{out:retrievable-unit-on-train:whole product minus sentences with the other fields, train precision@5}}."

[examples.agent-searches-in-traces]
say = "The code reads the agent's {{out:agent-searches-in-traces:traces}} traces, one per test query for each tool behind its search, BM25 and semantic retrieval, and prints the tool's description and the searches allowed. It compares each first search with the query as typed, finds {{out:agent-searches-in-traces:first searches that keep the query as typed}} of them unchanged, and lists the others, such as tye dye duvet cover searched as {{out:agent-searches-in-traces:first search for tye dye duvet cover}}. Then it counts each tool's searches and the traces that stop after one, and the BM25 searches whose stored results differ from the book's BM25."

[examples.agent-later-searches]
say = "For each tool, the code takes every search after an agent's first, finds the words it adds to those already searched, and counts how many of them the tool had shown in earlier results. Under semantic retrieval, {{out:agent-later-searches:semantic, of those, words the tool had shown}} of the {{out:agent-later-searches:semantic, words that later searches add}} added words had been shown."

[examples.agent-picks-by-tool]
say = "For each tool, the code counts the agent's picks that the tool never returned, {{out:agent-picks-by-tool:bm25, picks the tool never returned}} under BM25 and {{out:agent-picks-by-tool:semantic, picks the tool never returned}} under semantic retrieval, then the picks nobody judged, the traces with fewer than three picks, those whose searches returned no exact product, and those that saw one and picked none. It scores the picks by precision@3, {{out:agent-picks-by-tool:semantic, precision@3 of the picks}} with semantic retrieval and {{out:agent-picks-by-tool:bm25, precision@3 of the picks}} with BM25, makes the planned comparison, and, as an exploratory check, compares the picks with each tool's own top 3."

[[blocks]]
section = "retrieval-bounds-the-answer"
starts = "exact share = (cited products judged"
say = "An answer's exact share is the number of products it cites that people judged exact, divided by the number of products it cites, or 0 when it cites nothing."

[[blocks]]
section = "measure-the-context"
starts = "context recall@k    = (exact products"
say = "Context recall@k is the number of exact products in the top k, divided by the number of exact products judged for the query. Context precision@k is the mean of precision@i over the positions i, up to k, that hold an exact product."

[[tables]]
section = "retrieval-bounds-the-answer"
starts = "| Measure | Semantic | BM25 | Random |"
say = "A table of the recorded answers under each context, semantic, BM25 and random, one per column: how many contexts held an exact product, how many answers cited one, the products cited and the exact ones among them, the mean exact share, and the answers that recommend nothing. Semantic retrieval's answers have a mean exact share of {{out:rag-answers-by-context:semantic, mean exact share}} and BM25's {{out:rag-answers-by-context:bm25, mean exact share}}, while {{out:rag-answers-by-context:random, answers that recommend nothing}} of the answers from random contexts recommend nothing."

[[tables]]
section = "choose-the-retrievable-unit"
starts = "| Unit | precision@5 | recall@5 |"
say = "A table of the five units on the train queries, one per row: the whole product, the name only, the description only, sentences, and sentences with the other fields. Its columns give precision@5, recall@5, judged@5, and the train queries whose top 5 changes when ties break the other way. The whole product leads on precision@5 and recall@5, at {{out:retrievable-unit-on-train:whole product, train precision@5}} and {{out:retrievable-unit-on-train:whole product, train recall@5}}."

[[tables]]
section = "retrieval-for-llm-applications-decisions"
starts = "| Measure |"
say = "A table of the chapter's two planned comparisons, semantic retrieval minus BM25 on the test queries: the answers' mean exact share, and the agent's picks' precision@3. Its rows give each retriever's score, the mean difference, the wins, losses and ties, both p-values, whether the difference is established, the 97.5% interval, and whether the t-test and the interval agree. Neither difference is established."
