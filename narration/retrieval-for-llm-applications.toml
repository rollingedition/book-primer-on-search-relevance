# Spoken descriptions for chapter 10, Retrieval for LLM applications: what narration reads in place of each example,
# block and table.

[examples.catalog-against-the-context]
say = "The code reads the answer recording's manifest and prints the model, its licence, the prompt's instructions and the context window the recording set. Then it counts the words of every product as the LLM would read it, and compares the whole catalog with a median prompt of five products and, at one token per word, with the recording's window and the vendor's 200,000 tokens."

[examples.rag-answers-by-context]
say = "The code scores the recorded answers on the human grades: one answer per test query from each of three contexts, semantic retrieval's top 5, BM25's top 5, and five random products. For each kind of context it counts the contexts that hold an exact product, the products cited and the exact ones among them, and the answers that recommend nothing, and prints the mean exact share. Then it counts the answers that cite more exact products than their context holds, and makes the first planned comparison, semantic retrieval against BM25 on the exact share."

[examples.citations-inside-the-context]
say = "For all {{out:citations-inside-the-context:answers}} recorded answers, the code checks each cited ID against the answer's context, looks for an ID cited twice, and compares the field of cited IDs with the context IDs the answer's text writes out. It also counts the answers that cite nothing, and those that cite more than the three products the prompt allows."

[examples.faithful-but-partial]
say = "The code prints one answer, for medium size chandelier from the semantic context, with the product it cites, whether that product's description says medium-sized, the judges' label for it, and the number of exact products in its context. Then it counts the human grades of every product cited from the semantic and BM25 contexts, with the products nobody judged counted apart."

[examples.context-measures-by-hand]
say = "The code builds context recall and context precision by hand for the {{out:context-measures-by-hand:contexts}} contexts the two retrievers built, and checks them against the book's functions. It works through the semantic context for door jewelry organizer, printing its grades in order, its precision@5 and its context precision, then prints the range of exact products judged per test query, and the highest recall@5 the query with the most exact products could reach."

[examples.context-measures-against-answers]
say = "For the same {{out:context-measures-against-answers:contexts}} contexts, the code computes the Spearman correlation of recall@5, precision@5 and context precision with each answer's exact share, by hand as the correlation of their ranks, checks it against SciPy, and names the measure that correlates most weakly."

[examples.retrievable-unit-on-train]
say = "The code counts the products with no description and those the sample cut short, then indexes each of the five units with BM25, ranks products by their best unit on the train queries, and scores each unit's top 5 against the judgments. It also breaks ties the other way and counts the queries whose top 5 changes."

[examples.agent-searches-in-traces]
say = "The code reads the agent's {{out:agent-searches-in-traces:traces}} traces, one per test query for each tool behind its search, BM25 and semantic retrieval, and prints the tool's description and the searches allowed. It compares the first searches under the two tools and with the query as typed, lists those that change the query, and counts the traces whose first search returns the answer recording's context. Then it counts each tool's searches and the traces that stop after one, and the BM25 searches whose stored results differ from the book's BM25."

[examples.agent-later-searches]
say = "For each tool, the code takes every search after an agent's first, finds the words it adds to the shopper's query and the searches before it, and counts how many of those words the tool had shown in earlier results."

[examples.agent-picks-by-tool]
say = "For each tool, the code checks the agent's picks against every product its searches returned and against the judgments, scores the picks by precision@3, and makes the second planned comparison, semantic retrieval against BM25. As an exploratory check, it also scores the tool's own top 3 for the first search and compares the picks with it."

[[blocks]]
section = "retrieval-bounds-the-answer"
starts = "exact share = (cited products judged"
say = "An answer's exact share is the number of products it cites that people judged exact, divided by the number of products it cites, or 0 when it cites nothing."

[[blocks]]
section = "measure-the-context"
starts = "context recall@k    = (exact products"
say = "Context recall@k is the number of exact products in the top k, divided by the number of exact products judged for the query. Context precision@k is the mean of precision@i over the positions i, up to k, that hold an exact product."

[[tables]]
section = "retrieval-bounds-the-answer"
starts = "| Measure | Semantic | BM25 | Random |"
say = "A table of the recorded answers under each context, semantic, BM25 and random, one per column: how many contexts held an exact product, how many answers cited one, the products cited and the exact ones among them, the mean exact share, and the answers that recommend nothing. Semantic retrieval's answers have a mean exact share of {{out:rag-answers-by-context:semantic, mean exact share}} and BM25's {{out:rag-answers-by-context:bm25, mean exact share}}."

[[tables]]
section = "choose-the-retrievable-unit"
starts = "| Unit | precision@5 | recall@5 |"
say = "A table of the five units on the train queries, one per row: the whole product, the name only, the description only, sentences, and sentences with the other fields. Its columns give precision@5, recall@5, judged@5, and the train queries whose top 5 changes when ties break the other way. The whole product leads on precision@5 and recall@5, at {{out:retrievable-unit-on-train:whole product, train precision@5}} and {{out:retrievable-unit-on-train:whole product, train recall@5}}."

[[tables]]
section = "retrieval-for-llm-applications-decisions"
starts = "| Measure |"
say = "A table with one column for each planned comparison, the answers' mean exact share and precision@3 of the agent's picks. Its rows give each retriever's score, the mean difference, the wins, losses and ties, both p-values, whether the difference is established, the 97.5% interval, and whether the t-test and the interval agree. Neither difference is established."
