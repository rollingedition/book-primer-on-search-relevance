# Spoken descriptions for chapter 8, Understanding queries: what narration reads in place of each example, block and
# table.

[examples.catalog-spelling-corrector]
say = "The code counts every word in the catalog's text as the lexicon, and corrects each query word the catalog doesn't use to the commonest catalog word one edit away, or else two. It prints each query it changes beside its correction, checks that the book's shared corrector makes the same changes, and ends with how often the catalog uses a few words, among them the brands kohler and whitehaven."

[examples.spelling-context-counts]
say = "For the typo tye before dye, and the word an before water, the code prints the three catalog words within one edit that most often come right before the next word, then how often the corrector's own choice does. In both cases a word one edit away often comes before it, and the corrector's choice never does."

[examples.measure-spelling-corrections]
say = "For each of the store's {{out:measure-spelling-corrections:typo queries}} typo queries, and for tye dye duvet cover, the code corrects the query and scores BM25 on both spellings, and semantic retrieval where the recordings hold an embedding of the correct spelling. Correcting foutains with brick look raises both retrievers, ligth bulb doesn't move, and for the test queries the corrector either changes nothing or can't be scored for semantic retrieval."

[examples.normalize-units-both-sides]
say = "The code counts how the catalog writes inches after a number, with two apostrophes, a double quote or the word inch, and prints the terms the tokenizer makes of a few normalized texts. Then it builds BM25 over the text as written, under a first rule written from the queries, and under the full rule, and scores each of the {{out:normalize-units-both-sides:queries with a unit}} queries with a unit all three ways. Normalizing lifts the slow cooker query, while the first rule lowers the kitchen hood query, which the full rule puts back."

[examples.synonym-expansion-train-and-test]
say = "The code expands each query with the book's {{out:synonym-expansion-train-and-test:synonym groups}} synonym groups, and scores BM25 on the queries as typed and as expanded, on train and on test. On train it finds the largest gain, {{out:synonym-expansion-train-and-test:largest train gain}}, and the largest loss, {{out:synonym-expansion-train-and-test:largest train loss}}, which gets {{out:synonym-expansion-train-and-test:largest train loss, words added}} added and pulls unjudged hampers into its top 10. On test, the list changes {{out:synonym-expansion-train-and-test:test queries the list changes}} query, and in the planned comparison every test query scores the same either way."

[examples.query-classes-by-hand]
say = "The code trains naive Bayes by hand on word counts of the product text, one row per product and class, and predicts a class for every query, checking each prediction against scikit-learn's multinomial naive Bayes. Then it compares them with WANDS's query class and with the classes of each query's exact products, and prints three predictions, such as Light Bulbs for outdoor light fixtures, and the {{out:query-classes-by-hand:query classes that no product has}} query class that no product has."

[examples.class-boost-train-and-test]
say = "The code predicts each query's class with the classifier trained on products, and counts the exact train products outside their query's predicted class. On the train queries it compares semantic retrieval alone with a filter on the class, which scores lowest, and with five boosts to its similarities. The best boost goes to the planned test comparison: a mean difference of {{out:class-boost-train-and-test:class boost, semantic, mean difference}}."

[examples.llm-rewrites-on-train]
say = "The code reads the rewrite recording's manifest and prints the model, the embedding model and the prompt's first line, then three rewrites: a spelling fixed, a code kept, and malachi sled turned into a sofa, beside its exact products, which are tables. Then it scores BM25 on the rewritten text and semantic retrieval on the rewrite's embedding, over the train queries. Both score lower on the rewrites than on the queries as typed."

[examples.llm-rewrites-on-test]
say = "On the test queries, the code runs two planned comparisons, BM25 and semantic retrieval each on the rewrite against the query as typed, then repeats both on condensed lists as an exploratory check. Asked whether each difference is established, it answers {{out:llm-rewrites-on-test:llm rewrite, bm25, established at 0.01}} for BM25 and {{out:llm-rewrites-on-test:llm rewrite, semantic, established at 0.01}} for semantic retrieval, which loses on the rewrite."

[examples.rewrite-largest-changes]
say = "For each retriever, the code prints the test query whose score the rewrite lowers most and the one it raises most, each with the change, the rewrite and the number of unjudged products in the rewrite's top 10. For BM25's largest gain, refrigerator with ice an water in door, it also scores the query with only its spelling fixed, and finds that bm25s treats both words, an and its correction, as stop words."

[examples.hyde-train-and-test]
say = "On the train queries, the code searches with the hypothetical product's embedding alone and averaged with the query's, and for BM25 with the hypothetical text alone and with the query repeated five times before it. The hypothetical product alone loses for both retrievers, and keeping the query brings each back to about its score on the query alone. Then it runs the planned test comparison of HyDE against semantic retrieval: a mean difference of {{out:hyde-train-and-test:hyde, semantic, mean difference}}."

[examples.follow-up-refinements]
say = "The code searches each of the {{out:follow-up-refinements:conversations}} conversations those five ways and prints four shares of each way's top 10s, averaged over the conversations: products that state the value in their attributes, in their text or attributes, products of the right kind, and products that are both. Last, it compares the standalone rewrite with the joined turns conversation by conversation, and counts the conversations the filter leaves with fewer than 10 products."

[[blocks]]
section = "correct-spelling-from-catalog"
starts = "correction(t) = argmax over candidates"
say = "The correction of a typed word t is the candidate c that maximizes the probability of c times the probability of typing t when you mean c."

[[blocks]]
section = "classify-queries-from-products"
starts = "predicted class = argmax over classes"
say = "The predicted class is the one that maximizes the log probability of the class plus the sum, over the query's words, of the log probability of each word given the class. That word probability is the word's count in the class's text plus 1, over the number of words in the class's text plus the vocabulary size."

[[blocks]]
section = "hyde-hypothetical-products"
starts = "hyde(query) = (embedding(hypothetical"
say = "HyDE's vector for a query is the average of the hypothetical product's embedding and the query's embedding, scaled back to length 1."

[[tables]]
section = "understanding-queries-decisions"
starts = "| Measure | [BM25,"
say = "A table of the chapter's {{out:synonym-expansion-train-and-test:planned test comparisons}} planned comparisons on the test queries, one per column: BM25 with synonyms, semantic retrieval with the class boost, BM25 and semantic retrieval each on the LLM's rewrite, and semantic retrieval with HyDE, each against the same retriever on the query as typed. Its rows give the mean difference, the wins, losses and ties, both p-values, whether the difference is established, the 99% interval, and whether the t-test and the interval agree. The only established difference is semantic retrieval's loss on the LLM's rewrite, {{out:llm-rewrites-on-test:llm rewrite, semantic, mean difference}}."
